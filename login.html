<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library RFID System - Login</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/login.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-brand-panel" aria-label="Library RFID">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" />
            <path d="M4 5.5v16M8 7h8M8 11h8M8 15h5" />
          </svg>
        </div>
        <p class="eyebrow">Library RFID</p>
        <h1>Every visit,<br /><span>accounted for.</span></h1>
        <p class="brand-copy">A calmer, smarter way to keep your library moving.</p>
        <div class="brand-rule" aria-hidden="true"></div>
        <p class="brand-caption">Attendance management system</p>
      </section>

      <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-heading">
          <p class="eyebrow">Welcome back</p>
          <h2 id="login-title">Admin Login</h2>
          <p>Sign in to manage attendance.</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5" />
                <path d="M5 20c.7-3.2 3.1-5 7-5s6.3 1.8 7 5" />
              </svg>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username" required />
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2" />
              </svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
              <button class="password-toggle" type="button" aria-label="Show password" title="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M3 12s3.2-5 9-5 9 5 9 5-3.2 5-9 5-9-5-9-5Z" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
              </button>
            </div>
          </div>
          <div class="auth-options">
            <label class="remember-option"><input type="checkbox" name="remember" /> <span>Remember me</span></label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
          <p id="loginError" class="form-error" role="alert"></p>
          <button type="submit" class="scan-button auth-submit"><span>Sign In</span><span class="button-spinner" aria-hidden="true"></span></button>
        </form>
      </section>
    </main>
  </body>
</html>

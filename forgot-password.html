<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library RFID System - Forgot Password</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=2" />
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/forgot-password.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell auth-single">
      <div class="auth-form-group">
        <a class="auth-brand-label" href="index.html">
          <span class="auth-brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" />
              <path d="M4 5.5v16M8 7h8M8 11h8M8 15h5" />
            </svg>
          </span>
          <span class="auth-brand-name">RFID Library System</span>
        </a>
        <section class="auth-card" aria-labelledby="forgot-title">
          <div class="auth-heading">
            <p class="eyebrow">Account recovery</p>
            <h2 id="forgot-title">Forgot Password?</h2>
            <p>Enter your admin email and we'll send a reset link.</p>
          </div>
          <form id="forgotForm">
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <p id="forgotMessage" class="form-error" role="alert"></p>
            <button type="submit" class="scan-button auth-submit">Send Reset Link</button>
          </form>
          <a href="index.html" class="auth-back-link">Back to login</a>
        </section>
      </div>
    </main>
  </body>
</html>

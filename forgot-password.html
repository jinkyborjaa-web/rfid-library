<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library RFID System - Forgot Password</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/forgot-password.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell auth-single">
      <section class="auth-card" aria-labelledby="forgot-title">
        <div class="auth-heading">
          <p class="eyebrow">Account recovery</p>
          <h2 id="forgot-title">Forgot Password?</h2>
          <p>Enter your admin email and we'll send a reset link.</p>
        </div>
        <form id="forgotForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <p id="forgotMessage" class="form-error" role="alert"></p>
          <button type="submit" class="scan-button auth-submit">Send Reset Link</button>
        </form>
        <a href="login.html" class="auth-back-link">Back to login</a>
      </section>
    </main>
  </body>
</html>

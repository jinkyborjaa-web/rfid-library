<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library RFID System - Reset Password</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/reset-password.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell auth-single">
      <div class="auth-form-group">
        <a class="auth-brand-label" href="index.html">
          <span class="auth-brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" />
              <path d="M4 5.5v16M8 7h8M8 11h8M8 15h5" />
            </svg>
          </span>
          <span class="auth-brand-name">RFID Library System</span>
        </a>
        <section class="auth-card" aria-labelledby="reset-title">
          <div class="auth-heading">
            <p class="eyebrow">Account recovery</p>
            <h2 id="reset-title">Set a New Password</h2>
            <p>Choose a new password for your admin account.</p>
          </div>
          <form id="resetForm">
            <div class="form-group">
              <label for="newPassword">New Password</label>
              <input id="newPassword" name="password" type="password" minlength="8" required />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required />
            </div>
            <p id="resetMessage" class="form-error" role="alert"></p>
            <button type="submit" class="scan-button auth-submit">Reset Password</button>
            <a id="resetLoginLink" href="index.html" class="auth-back-link">Back to Login</a>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>

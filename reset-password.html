<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library RFID System - Reset Password</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/reset-password.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell auth-single">
      <section class="auth-card" aria-labelledby="reset-title">
        <div class="auth-heading">
          <p class="eyebrow">Account recovery</p>
          <h2 id="reset-title">Set a New Password</h2>
          <p>Choose a new password for your admin account.</p>
        </div>
        <form id="resetForm">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input id="newPassword" name="password" type="password" minlength="8" required />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required />
          </div>
          <p id="resetMessage" class="form-error" role="alert"></p>
          <button type="submit" class="scan-button auth-submit">Reset Password</button>
          <a id="resetLoginLink" href="login.html" class="auth-back-link">Back to Login</a>
        </form>
      </section>
    </main>
  </body>
</html>
